name: CI

on:
    push:
        branches:
            - main
            - v2-production
            - feat/v2-scraper-ingestion
            - feat/v2-data-pipline
            - feat/topic-modeling 
            - feat/api
        paths-ignore:
            - "**.md"
    pull_request:
        branches:
            - main
            - v2-production
        paths-ignore:
            - "**.md"

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: ["ubuntu-latest", "windows-latest"]
                python-version:
                    - "3.11"
                    - "3.12"

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up uv
              uses: astral-sh/setup-uv@v10.0.0
              with:
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"
                  python-version: ${{ matrix.python-version }}

            - name: Install dependencies
              run: uv sync --locked --group dev --group api

            - name: Run tests
              run: uv run pytest -q

    frontend:
        name: Frontend / Node 20
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: src/frontend

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: npm
                  cache-dependency-path: src/frontend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Typecheck
              run: npx tsc -b --noEmit

            - name: Lint
              run: npm run lint

            - name: Run tests
              run: npm run test